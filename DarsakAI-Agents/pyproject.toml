[project]
name = "darsakai-agents"
version = "0.1.0"
description = "Hierarchical Multi-Agent System for DarsakAI Educational Platform"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.0.0",
    "crewai-tools>=1.0.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-ollama>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "aiofiles>=23.2.0",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "fastapi>=0.110.0",
    "pydantic[email]>=2.7.0",
    "python-multipart>=0.0.9",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]